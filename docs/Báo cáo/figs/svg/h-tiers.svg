<text x="230" y="16" font-family="'Times New Roman', 'Liberation Serif', serif" font-size="9.5" fill="#0E2841" text-anchor="middle" dominant-baseline="middle" font-weight="bold" letter-spacing="1">BA TẦNG PHÂN LOẠI NGUYỆN VỌNG</text>
